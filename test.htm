<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            margin: 0;
            background: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .weather-card {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            width: 260px;
            text-align: center;
            border: 1px solid #333;
        }
        .city {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .temp {
            font-size: 48px;
            font-weight: bold;
            color: #4da6ff;
            margin: 10px 0;
        }
        .details {
            font-size: 13px;
            color: #ccc;
            line-height: 1.5;
            border-top: 1px solid #333;
            padding-top: 10px;
            margin-top: 10px;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="weather-card">
        <div class="city">Gdynia</div>
        <div class="temp" id="temp">--°C</div>
        <div class="details" id="details">Pobieranie pogody...</div>
    </div>

    <script>
        function loadWeather() {
            // Używamy endpointu forecast z Twoimi współrzędnymi
            const url = 'https://api.open-meteo.com/v1/forecast?latitude=54.4743466&longitude=18.4826286&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m&timezone=auto';
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    const current = data.current;
                    document.getElementById('temp').innerText = current.temperature_2m + '°C';
                    document.getElementById('details').innerHTML = 
                        `Wiatr: <b>${current.wind_speed_10m} km/h</b><br>` +
                        `Opady: <b>${current.precipitation} mm</b><br>` +
                        `Wilgotność: <b>${current.relative_humidity_2m}%</b>`;
                })
                .catch(err => {
                    document.getElementById('details').innerText = 'Błąd pobierania danych';
                    console.error(err);
                });
        }

        // Załaduj od razu
        loadWeather();

        // Odświeżaj dane co 10 minut
        setInterval(loadWeather, 600000);
    </script>

</body>
</html>
