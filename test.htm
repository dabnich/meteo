<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            margin: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <img id="radar-img" src="" alt="Ładowanie radaru RainViewer...">

    <script>
        function loadLatestRadar() {
            // Pobieramy publiczny plik JSON z RainViewer z listą dostępnych klatek
            fetch('https://api.rainviewer.com/public/weather-maps.json')
                .response => response.json()
                .then(data => {
                    // Sprawdzamy czy są dostępne klatki archiwalne/aktualne (past)
                    if (data && data.radar && data.radar.past && data.radar.past.length > 0) {
                        // Bierzemy ostatnią (najświeższą) klatkę
                        const latestFrame = data.radar.past[data.radar.past.length - 1];
                        const timestamp = latestFrame.time;
                        
                        // Składamy adres URL do gotowej nałożonej mapy (kolor styl=2, rozmiar, klatka czasowa)
                        // Host kafelków RainViewer pozwala na pobranie gotowej kompozycji
                        const imageUrl = `https://tile.rainviewer.com/v2/radar/${timestamp}/512/4/54.5/18.5/4_1.png`;
                        
                        document.getElementById('radar-img').src = imageUrl;
                    }
                })
                .catch(err => console.error("Błąd pobierania radaru:", err));
        }

        // Załaduj od razu po otwarciu
        loadLatestRadar();

        // Odświeżaj co 10 minut (600000 ms), żeby widżet dociągał nowe opady
        setInterval(loadLatestRadar, 600000);
    </script>

</body>
</html>
